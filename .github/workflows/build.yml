name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          unzip -q DesktopPet.zip
          cd DesktopPet
          gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp DesktopPet/app/build/outputs/apk/debug/app-debug.apk DesktopPet.apk
          gh release create "v${{ github.run_number }}" DesktopPet.apk --title "桌宠 v${{ github.run_number }}" --notes "下载 DesktopPet.apk 安装"
